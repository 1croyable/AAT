[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aat"
version = "0.1.0"
description = "Anchor-based Additive Transport model for PyTorch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.0"]

keywords = [
    "pytorch",
    "neural-network",
    "classification",
    "transport",
    "representation-learning"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aat*"]

[project.urls]
Homepage = "https://github.com/1croyable/AAT"
Repository = "https://github.com/1croyable/AAT"